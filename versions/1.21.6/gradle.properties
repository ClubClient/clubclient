# Minecraft coordinates for this version node. Versions verified against meta.fabricmc.net, the
# Modrinth API and piston-meta on 2026-07-22 — not remembered.
#
# yarn 1.21.6+build.1 is the only build for this version and carries stable:false. That is NOT a
# warning about this node: 1.21.8, which we already ship, is also a single stable:false build. The
# flag is Fabric's promotion marker, not a quality gate.
minecraft_version=1.21.6
yarn_mappings=1.21.6+build.1
fabric_api_version=0.128.2+1.21.6

# The Minecraft range this jar declares to Fabric. Pinned to this node: a jar built against 1.21.6
# that claims another version is one Fabric refuses to load.
#
# 1.21.7 exists (released 2025-06-30) and is deliberately NOT swept in. Widening to <1.21.8 would be
# a claim no build of ours has ever tested — 1.21.7's mappings and Fabric API coordinates are
# unmeasured. An untested range is the kind of number this project does not print.
minecraft_range=>=1.21.6 <1.21.7
