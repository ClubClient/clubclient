plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Compat testing only (see the clubCompat deps below) — nothing here ships in the jar.
	exclusiveContent {
		forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

	// ---- MOD-COMPAT TESTING (runtime only, -PclubCompat) --------------------------------------
	// Club is a client mod: the way it breaks for real people is a mixin conflict with the mods they
	// already run. These are the ones that touch the SAME seams we do — Sodium/Iris rewrite the world
	// render and the lightmap; Freecam and Shoulder Surfing hook Mouse/Camera, i.e. the exact call our
	// look hook wraps. Loom remaps them for the dev runtime (dropping the production jars into
	// run/mods does NOT work — they carry intermediary refmaps and blow up in a named-mappings dev run).
	//   ./gradlew runClient -PclubCompat        → launch with the lot
	//   ./gradlew runClient -PclubCompat -PclubIris  → …and the shader pipeline on top
	// (Iris/Sodium ship for PRODUCTION mappings; the 1.8.14 BETA fails to even parse its own mixins in a
	//  dev runtime, so the compat set pins the last release. Shoulder Surfing is left out: its config
	//  library is jar-in-jar'd and doesn't resolve here — that's its packaging, not our compatibility.)
	if (project.hasProperty("clubCompat")) {
		modRuntimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
		modRuntimeOnly "maven.modrinth:freecam:1.3.0+mc1.21.1"
		modRuntimeOnly "maven.modrinth:cloth-config:15.0.140+fabric"   // freecam's config lib
		if (project.hasProperty("clubIris")) {
			modRuntimeOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"
			// Iris ships these INSIDE its jar (jar-in-jar) and Loom does not unpack a modRuntimeOnly's
			// nested jars, so a dev run dies on NoClassDefFoundError: org/anarres/cpp/PreprocessorListener
			// the moment it compiles a shaderpack. They are Iris's GLSL preprocessor + transformer.
			runtimeOnly "org.anarres:jcpp:1.4.14"
			runtimeOnly "io.github.douira:glsl-transformer:2.0.1"
		}
	}
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	// Pin the runtime/compile toolchain to JDK 21 (the version MC 1.21.1 + LWJGL 3.3.3 support).
	// Without this, the build/runClient use whatever JDK runs Gradle (e.g. 25) — an unsupported
	// combo that LWJGL flags as "Unsupported JNI version" and can cause situational GL instability.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// The UI atlases are rendered from Onest (SIL OFL 1.1), so the jar redistributes a derivative of it.
	// OFL §2 wants the copyright notice and licence to travel with any such distribution.
	from("tools/fonts/OFL.txt") {
		rename { "OFL_${project.base.archivesName.get()}" }
	}
}

test {
	useJUnitPlatform()
}

// Offline icon SDF atlas (Stage 11). Sources: tools/icons/src/<HHHH>_<name>.svg (HHHH = PUA code
// point). Generator lives in buildSrc (club.tools.IconAtlasGen) — exact stroke SDF, no external
// tool. Run manually after adding/editing icons: ./gradlew genIconAtlas
tasks.register("genIconAtlas") {
	group = "club"
	description = "Generate the icon SDF atlas from tools/icons/src into assets/club/ui/icon/msdf."
	doLast {
		club.tools.IconAtlasGen.run(
			file("tools/icons/src"),
			file("src/main/resources/assets/club/ui/icon/msdf/icons.png"),
			file("src/main/resources/assets/club/ui/icon/msdf/icons.json"))
	}
}

// Software preview board of the icon atlas (shader-accurate alpha math) — for eyeballing icon
// quality at real UI sizes without launching the client. Output: build/icon-previews/board.png
tasks.register("genIconPreviews") {
	group = "club"
	description = "Render a preview board of the icon atlas at 17/24/40/72px + ghost."
	doLast {
		club.tools.IconPreview.run(
			file("tools/icons/src"),
			file("build/icon-previews/board.png"),
			0xF4F6FA)   // textHi — neutral judgement tint; category tints come with the cards
	}
}

// Discord custom emoji: the module icons as standalone transparent PNGs in the brand accent.
// Output: build/discord/emoji/club_<name>.png — upload in Server Settings -> Emoji.
// Same SDF alpha math as the in-game shader, so the emoji in chat IS the icon in the menu.
tasks.register("genDiscordEmoji") {
	group = "club"
	description = "Render the module icons as Discord emoji PNGs (128px, transparent, accent-tinted)."
	doLast {
		System.setProperty("java.awt.headless", "true")
		club.tools.EmojiGen.run(
			file("tools/icons/src"),
			file("build/discord/emoji"),
			0x7CABFF)   // accent — docs/DESIGN.md; flat, never a gradient
	}
}

// Discord server icon + banner. Both are brand surfaces, so both are generated, not hand-drawn.
//   icon:   build/discord/icon.png    512x512 — Discord crops it to a CIRCLE, so the mark is drawn
//           larger than in docs/icon.png (the corners are thrown away; a mark sized for a square
//           reads small in a circle, and the sidebar renders it at 48px).
//   banner: build/discord/banner.png  960x540 — needs boost level 1. Set in the brand typeface
//           (Onest, tools/fonts) so it is the same letterforms as the mod's own UI.
tasks.register("genDiscordBrand") {
	group = "club"
	description = "Render the Discord server icon (circle-safe) and banner into build/discord/."
	doLast {
		System.setProperty("java.awt.headless", "true")

		// --- the trefoil, in the 24-unit logo space (same geometry as genPromoIcon / E021_logo.svg) ---
		def trefoil = {
			def area = new java.awt.geom.Area()
			area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(7.8d, 3.2d, 8.4d, 8.4d)))
			area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(2.9d, 9.7d, 8.4d, 8.4d)))
			area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(12.7d, 9.7d, 8.4d, 8.4d)))
			area.add(new java.awt.geom.Area(new java.awt.geom.RoundRectangle2D.Double(10.8d, 13.5d, 2.4d, 7.0d, 2.4d, 2.4d)))
			return area
		}
		// Groovy miscompiles primitive-typed closure params here ("Bad local variable type"), so these
		// stay untyped — the values are always doubles at the call sites below.
		def placeMark = { area, cx, cy, widthPx ->
			def at = new java.awt.geom.AffineTransform()
			at.translate((double) cx, (double) cy)
			double s = ((double) widthPx) / 18.2d     // logo bbox width = 18.2 (x 2.9..21.1)
			at.scale(s, s)
			at.translate(-12.0d, -11.85d)             // logo bbox centre
			return area.createTransformedArea(at)
		}
		def hints = { g ->
			g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
			g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
			g.setRenderingHint(java.awt.RenderingHints.KEY_STROKE_CONTROL, java.awt.RenderingHints.VALUE_STROKE_PURE)
			g.setRenderingHint(java.awt.RenderingHints.KEY_TEXT_ANTIALIASING, java.awt.RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
		}
		def outDir = file("build/discord"); outDir.mkdirs()

		// ---------------- icon: 512x512, circle-safe ----------------
		int S = 512
		def icon = new java.awt.image.BufferedImage(S, S, java.awt.image.BufferedImage.TYPE_INT_ARGB)
		def g = icon.createGraphics(); hints(g)
		// Full-bleed tile: the circle crop eats the corners anyway, so rounding them buys nothing and
		// a rounded tile inside a circle just loses radius. Flat brand gradient, top to bottom.
		g.setPaint(new java.awt.GradientPaint(0f, 0f, new java.awt.Color(0x16, 0x1F, 0x30),
				0f, (float) S, new java.awt.Color(0x0A, 0x10, 0x18)))
		g.fillRect(0, 0, S, S)
		// 340px mark (66% of the tile) vs 300 in the square icon: sized for the circle, not the square.
		def mark = placeMark(trefoil(), S / 2.0d, S / 2.0d + 8.0d, 340.0d)
		def mb = mark.getBounds2D()
		g.setPaint(new java.awt.GradientPaint((float) mb.getMinX(), (float) mb.getMinY(), new java.awt.Color(0x9C, 0xC2, 0xFF),
				(float) mb.getMinX(), (float) mb.getMaxY(), new java.awt.Color(0x6C, 0x97, 0xEC)))
		g.fill(mark)
		g.dispose()
		def iconFile = new File(outDir, "icon.png")
		javax.imageio.ImageIO.write(icon, "png", iconFile)

		// ---------------- banner: 960x540 ----------------
		int BW = 960, BH = 540
		def banner = new java.awt.image.BufferedImage(BW, BH, java.awt.image.BufferedImage.TYPE_INT_RGB)
		def b = banner.createGraphics(); hints(b)
		b.setPaint(new java.awt.GradientPaint(0f, 0f, new java.awt.Color(0x0F, 0x16, 0x24),
				0f, (float) BH, new java.awt.Color(0x0B, 0x11, 0x1A)))
		b.fillRect(0, 0, BW, BH)

		// Discord lays the server NAME over the bottom of this image, so the lockup sits in the upper
		// middle and the bottom third is left empty on purpose. The whole lockup is measured, then
		// centred as one block — so the mark, the word and the tagline balance instead of drifting off
		// the right edge, which is what happened when the wordmark was positioned from the mark.
		def ttf = file("tools/fonts/inter_semibold.ttf")   // named inter_*, contains Onest (OFL 1.1)
		def brand = java.awt.Font.createFont(java.awt.Font.TRUETYPE_FONT, ttf)
		def wordFont = brand.deriveFont(88f)
		def subFont = brand.deriveFont(24f)
		String word = "CLUB"
		String tagline = "a first-person utility client for Minecraft"

		def wfm = b.getFontMetrics(wordFont)
		def sfm = b.getFontMetrics(subFont)
		double markW = 132d
		double gap = 44d
		double textW = Math.max((double) wfm.stringWidth(word), (double) sfm.stringWidth(tagline))
		double lockW = markW + gap + textW
		double x0 = (BW - lockW) / 2d               // centred as a block
		double cy = BH * 0.40d                      // upper middle — the name plate lands below

		def bmark = placeMark(trefoil(), x0 + markW / 2d, cy, markW)
		b.setColor(new java.awt.Color(0x7C, 0xAB, 0xFF))   // FLAT accent — docs/DESIGN.md
		b.fill(bmark)

		int tx = (int) Math.round(x0 + markW + gap)
		int baseline = (int) Math.round(cy - 6)
		b.setFont(wordFont)
		b.setColor(new java.awt.Color(0xF4, 0xF6, 0xFA))   // textHi
		b.drawString(word, tx, baseline)

		// The design system permits exactly one gradient — the active-tab underline. This is that shape,
		// and it is FLAT here: an accent rule under the wordmark. No glow, no glass.
		b.setColor(new java.awt.Color(0x7C, 0xAB, 0xFF))
		b.fillRect(tx, baseline + 20, wfm.stringWidth(word), 4)

		b.setFont(subFont)
		b.setColor(new java.awt.Color(0x8B, 0x97, 0xA8))   // textLo
		b.drawString(tagline, tx, baseline + 66)
		b.dispose()
		def bannerFile = new File(outDir, "banner.png")
		javax.imageio.ImageIO.write(banner, "png", bannerFile)

		logger.lifecycle("[discord] wrote ${iconFile} and ${bannerFile}")
	}
}

// Brand icon (512x512): a rounded dark tile (brand gradient) + the club-suit trefoil in accent,
// matching the in-game logo geometry (tools/icons/src/E021_logo.svg). Run: ./gradlew genPromoIcon
// Writes docs/icon.png (Modrinth/promo) and the mod-list icon (assets/club/icon.png).
tasks.register("genPromoIcon") {
	group = "club"
	description = "Render the 512x512 brand icon to docs/icon.png and assets/club/icon.png."
	doLast {
		System.setProperty("java.awt.headless", "true")
		int S = 512
		def img = new java.awt.image.BufferedImage(S, S, java.awt.image.BufferedImage.TYPE_INT_ARGB)
		def g = img.createGraphics()
		g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
		g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
		g.setRenderingHint(java.awt.RenderingHints.KEY_STROKE_CONTROL, java.awt.RenderingHints.VALUE_STROKE_PURE)
		// rounded tile clip → transparent corners
		double rad = 112d
		def tile = new java.awt.geom.RoundRectangle2D.Double(0d, 0d, (double) S, (double) S, rad * 2, rad * 2)
		g.setClip(tile)
		// brand vertical gradient background (neutral-dark, no glow)
		g.setPaint(new java.awt.GradientPaint(0f, 0f, new java.awt.Color(0x16, 0x1F, 0x30),
				0f, (float) S, new java.awt.Color(0x0A, 0x10, 0x18)))
		g.fillRect(0, 0, S, S)
		// whisper of inner light on the top edge (recessed polish, not glow)
		g.setColor(new java.awt.Color(255, 255, 255, 16))
		g.fill(new java.awt.geom.RoundRectangle2D.Double(0d, 0d, (double) S, 5d, rad, rad))
		// trefoil (union of 3 circles + stem) built in the 24-unit logo space, then fitted
		def area = new java.awt.geom.Area()
		area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(7.8d, 3.2d, 8.4d, 8.4d)))    // top   (12, 7.4)
		area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(2.9d, 9.7d, 8.4d, 8.4d)))    // left  (7.1, 13.9)
		area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(12.7d, 9.7d, 8.4d, 8.4d)))   // right (16.9, 13.9)
		area.add(new java.awt.geom.Area(new java.awt.geom.RoundRectangle2D.Double(10.8d, 13.5d, 2.4d, 7.0d, 2.4d, 2.4d)))
		double target = 300.0                 // mark width in px
		double scale = target / 18.2          // logo bbox width ≈ 18.2 (x 2.9..21.1)
		def at = new java.awt.geom.AffineTransform()
		at.translate(S / 2.0, S / 2.0 + 6.0)  // nudge down: the top lobe is smaller than the base pair
		at.scale(scale, scale)
		at.translate(-12.0, -11.85)           // logo bbox centre
		def mark = area.createTransformedArea(at)
		// subtle accent gradient on the mark (promo asset — richer than the flat in-game chrome)
		def b = mark.getBounds2D()
		g.setPaint(new java.awt.GradientPaint((float) b.getMinX(), (float) b.getMinY(), new java.awt.Color(0x9C, 0xC2, 0xFF),
				(float) b.getMinX(), (float) b.getMaxY(), new java.awt.Color(0x6C, 0x97, 0xEC)))
		g.fill(mark)
		g.dispose()
		def promo = file("docs/icon.png"); promo.parentFile.mkdirs()
		javax.imageio.ImageIO.write(img, "png", promo)
		def modIcon = file("src/main/resources/assets/club/icon.png")
		javax.imageio.ImageIO.write(img, "png", modIcon)
		logger.lifecycle("wrote ${promo} and ${modIcon}")
	}
}

// Offline MSDF atlas generation. Downloads a pinned msdf-atlas-gen and renders the three font
// weights to assets/club/ui/font/msdf/. Run manually: ./gradlew genMsdfAtlas
//
// WINDOWS ONLY: this downloads the win64 build of msdf-atlas-gen and runs the .exe directly, so it
// will fail on Linux/macOS. It is not part of `build` — the generated atlases are committed, so a
// clone on any OS builds and runs fine; you only need this task when the fonts or the charset change.
// To regenerate elsewhere, build msdf-atlas-gen from source and point `exe` at it — keep the flags
// (-size 40 -pxrange 6 -type msdf) and the charset identical or the committed atlas will not
// reproduce byte-for-byte.
//
// Source fonts live in tools/fonts/ (NOT in the resources tree — they must not ship inside the jar;
// only the rendered atlases do). Despite the file names they contain the Onest typeface, SIL OFL 1.1
// — see THIRD-PARTY-NOTICES.md and tools/fonts/OFL.txt.
tasks.register("genMsdfAtlas") {
	group = "club"
	description = "Generate MSDF atlases for the UI font (Latin+Cyrillic+Punct+Symbols). Windows-only."
	doLast {
		def toolDir = file("build/tools")
		def exe = file("build/tools/msdf-atlas-gen-1.4/msdf-atlas-gen/msdf-atlas-gen.exe")
		if (!exe.exists()) {
			toolDir.mkdirs()
			def zip = new File(toolDir, "msdf-atlas-gen-1.4-win64.zip")
			// Use Java standard APIs (Gradle 9-compatible — no URL.withInputStream)
			def url = new java.net.URI("https://github.com/Chlumsky/msdf-atlas-gen/releases/download/v1.4/msdf-atlas-gen-1.4-win64.zip").toURL()
			def conn = url.openConnection()
			conn.setConnectTimeout(30000)
			conn.setReadTimeout(120000)
			zip.withOutputStream { out ->
				conn.inputStream.withCloseable { ins -> ins.transferTo(out) }
			}
			// Unzip using java.util.zip (no Gradle copy{}/zipTree)
			def destDir = new File(toolDir, "msdf-atlas-gen-1.4")
			destDir.mkdirs()
			def destCanon = destDir.canonicalPath
			new java.util.zip.ZipFile(zip).withCloseable { zf ->
				zf.entries().each { entry ->
					def entryFile = new File(destDir, entry.name)
					// Zip-slip guard: ensure extracted path is under destDir
					if (!entryFile.canonicalPath.startsWith(destCanon + File.separator) &&
							entryFile.canonicalPath != destCanon) {
						throw new GradleException("Zip-slip detected: ${entry.name}")
					}
					if (entry.isDirectory()) {
						entryFile.mkdirs()
					} else {
						entryFile.parentFile?.mkdirs()
						new FileOutputStream(entryFile).withCloseable { fos ->
							zf.getInputStream(entry).withCloseable { ins -> ins.transferTo(fos) }
						}
					}
				}
			}
		}
		def charset = file("build/tools/ui_charset.txt")
		charset.text = "[0x20, 0x7E], [0xA0, 0xFF], [0x0400, 0x04FF], 0x2013, 0x2014, 0x2018, 0x2019, 0x201C, 0x201D, 0x2022, 0x2026, 0x2192, 0x221E"
		def out = file("src/main/resources/assets/club/ui/font/msdf"); out.mkdirs()
		["regular", "medium", "semibold"].each { w ->
			// Fonts moved to tools/fonts/ in 70a44f0; this path still pointed at the (now empty)
			// resources dir, so the task died with "Failed to load specified font file".
			def font = file("tools/fonts/inter_${w}.ttf")
			if (!font.exists()) throw new GradleException("Source font not found: ${font}")
			// Use ProcessBuilder (Gradle 9-compatible — no exec{} on DefaultTask)
			def cmd = [
				exe.absolutePath,
				"-font", font.absolutePath,
				"-charset", charset.absolutePath,
				"-type", "msdf", "-format", "png", "-size", "40", "-pxrange", "6",
				"-imageout", new File(out, "inter_${w}.png").absolutePath,
				"-json", new File(out, "inter_${w}.json").absolutePath
			]
			def pb = new ProcessBuilder(cmd)
			pb.redirectErrorStream(true)
			pb.directory(projectDir)
			def proc = pb.start()
			proc.inputStream.eachLine { line -> logger.lifecycle(line) }
			def exitCode = proc.waitFor()
			if (exitCode != 0) throw new GradleException("msdf-atlas-gen failed for weight '${w}' (exit ${exitCode})")
		}
	}
}