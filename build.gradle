plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	// No sources jar — Club is All-Rights-Reserved, closed-source; only the compiled jar ships.
	// Pin the runtime/compile toolchain to JDK 21 (the version MC 1.21.1 + LWJGL 3.3.3 support).
	// Without this, the build/runClient use whatever JDK runs Gradle (e.g. 25) — an unsupported
	// combo that LWJGL flags as "Unsupported JNI version" and can cause situational GL instability.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

test {
	useJUnitPlatform()
}

// Offline icon SDF atlas (Stage 11). Sources: tools/icons/src/<HHHH>_<name>.svg (HHHH = PUA code
// point). Generator lives in buildSrc (club.tools.IconAtlasGen) — exact stroke SDF, no external
// tool. Run manually after adding/editing icons: ./gradlew genIconAtlas
tasks.register("genIconAtlas") {
	group = "club"
	description = "Generate the icon SDF atlas from tools/icons/src into assets/club/ui/icon/msdf."
	doLast {
		club.tools.IconAtlasGen.run(
			file("tools/icons/src"),
			file("src/main/resources/assets/club/ui/icon/msdf/icons.png"),
			file("src/main/resources/assets/club/ui/icon/msdf/icons.json"))
	}
}

// Software preview board of the icon atlas (shader-accurate alpha math) — for eyeballing icon
// quality at real UI sizes without launching the client. Output: build/icon-previews/board.png
tasks.register("genIconPreviews") {
	group = "club"
	description = "Render a preview board of the icon atlas at 17/24/40/72px + ghost."
	doLast {
		club.tools.IconPreview.run(
			file("tools/icons/src"),
			file("build/icon-previews/board.png"),
			0xF4F6FA)   // textHi — neutral judgement tint; category tints come with the cards
	}
}

// Brand icon (512x512): a rounded dark tile (brand gradient) + the club-suit trefoil in accent,
// matching the in-game logo geometry (tools/icons/src/E021_logo.svg). Run: ./gradlew genPromoIcon
// Writes docs/icon.png (Modrinth/promo) and the mod-list icon (assets/club/icon.png).
tasks.register("genPromoIcon") {
	group = "club"
	description = "Render the 512x512 brand icon to docs/icon.png and assets/club/icon.png."
	doLast {
		System.setProperty("java.awt.headless", "true")
		int S = 512
		def img = new java.awt.image.BufferedImage(S, S, java.awt.image.BufferedImage.TYPE_INT_ARGB)
		def g = img.createGraphics()
		g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
		g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
		g.setRenderingHint(java.awt.RenderingHints.KEY_STROKE_CONTROL, java.awt.RenderingHints.VALUE_STROKE_PURE)
		// rounded tile clip → transparent corners
		double rad = 112d
		def tile = new java.awt.geom.RoundRectangle2D.Double(0d, 0d, (double) S, (double) S, rad * 2, rad * 2)
		g.setClip(tile)
		// brand vertical gradient background (neutral-dark, no glow)
		g.setPaint(new java.awt.GradientPaint(0f, 0f, new java.awt.Color(0x16, 0x1F, 0x30),
				0f, (float) S, new java.awt.Color(0x0A, 0x10, 0x18)))
		g.fillRect(0, 0, S, S)
		// whisper of inner light on the top edge (recessed polish, not glow)
		g.setColor(new java.awt.Color(255, 255, 255, 16))
		g.fill(new java.awt.geom.RoundRectangle2D.Double(0d, 0d, (double) S, 5d, rad, rad))
		// trefoil (union of 3 circles + stem) built in the 24-unit logo space, then fitted
		def area = new java.awt.geom.Area()
		area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(7.8d, 3.2d, 8.4d, 8.4d)))    // top   (12, 7.4)
		area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(2.9d, 9.7d, 8.4d, 8.4d)))    // left  (7.1, 13.9)
		area.add(new java.awt.geom.Area(new java.awt.geom.Ellipse2D.Double(12.7d, 9.7d, 8.4d, 8.4d)))   // right (16.9, 13.9)
		area.add(new java.awt.geom.Area(new java.awt.geom.RoundRectangle2D.Double(10.8d, 13.5d, 2.4d, 7.0d, 2.4d, 2.4d)))
		double target = 300.0                 // mark width in px
		double scale = target / 18.2          // logo bbox width ≈ 18.2 (x 2.9..21.1)
		def at = new java.awt.geom.AffineTransform()
		at.translate(S / 2.0, S / 2.0 + 6.0)  // nudge down: the top lobe is smaller than the base pair
		at.scale(scale, scale)
		at.translate(-12.0, -11.85)           // logo bbox centre
		def mark = area.createTransformedArea(at)
		// subtle accent gradient on the mark (promo asset — richer than the flat in-game chrome)
		def b = mark.getBounds2D()
		g.setPaint(new java.awt.GradientPaint((float) b.getMinX(), (float) b.getMinY(), new java.awt.Color(0x9C, 0xC2, 0xFF),
				(float) b.getMinX(), (float) b.getMaxY(), new java.awt.Color(0x6C, 0x97, 0xEC)))
		g.fill(mark)
		g.dispose()
		def promo = file("docs/icon.png"); promo.parentFile.mkdirs()
		javax.imageio.ImageIO.write(img, "png", promo)
		def modIcon = file("src/main/resources/assets/club/icon.png")
		javax.imageio.ImageIO.write(img, "png", modIcon)
		logger.lifecycle("wrote ${promo} and ${modIcon}")
	}
}

// Offline MSDF atlas generation. Downloads a pinned msdf-atlas-gen and renders
// Inter weights to assets/club/ui/font/msdf/. Run manually: ./gradlew genMsdfAtlas
tasks.register("genMsdfAtlas") {
	group = "club"
	description = "Generate MSDF atlases for Inter (Latin+Cyrillic+Punct+Symbols)."
	doLast {
		def toolDir = file("build/tools")
		def exe = file("build/tools/msdf-atlas-gen-1.4/msdf-atlas-gen/msdf-atlas-gen.exe")
		if (!exe.exists()) {
			toolDir.mkdirs()
			def zip = new File(toolDir, "msdf-atlas-gen-1.4-win64.zip")
			// Use Java standard APIs (Gradle 9-compatible — no URL.withInputStream)
			def url = new java.net.URI("https://github.com/Chlumsky/msdf-atlas-gen/releases/download/v1.4/msdf-atlas-gen-1.4-win64.zip").toURL()
			def conn = url.openConnection()
			conn.setConnectTimeout(30000)
			conn.setReadTimeout(120000)
			zip.withOutputStream { out ->
				conn.inputStream.withCloseable { ins -> ins.transferTo(out) }
			}
			// Unzip using java.util.zip (no Gradle copy{}/zipTree)
			def destDir = new File(toolDir, "msdf-atlas-gen-1.4")
			destDir.mkdirs()
			def destCanon = destDir.canonicalPath
			new java.util.zip.ZipFile(zip).withCloseable { zf ->
				zf.entries().each { entry ->
					def entryFile = new File(destDir, entry.name)
					// Zip-slip guard: ensure extracted path is under destDir
					if (!entryFile.canonicalPath.startsWith(destCanon + File.separator) &&
							entryFile.canonicalPath != destCanon) {
						throw new GradleException("Zip-slip detected: ${entry.name}")
					}
					if (entry.isDirectory()) {
						entryFile.mkdirs()
					} else {
						entryFile.parentFile?.mkdirs()
						new FileOutputStream(entryFile).withCloseable { fos ->
							zf.getInputStream(entry).withCloseable { ins -> ins.transferTo(fos) }
						}
					}
				}
			}
		}
		def charset = file("build/tools/ui_charset.txt")
		charset.text = "[0x20, 0x7E], [0xA0, 0xFF], [0x0400, 0x04FF], 0x2013, 0x2014, 0x2018, 0x2019, 0x201C, 0x201D, 0x2022, 0x2026, 0x2192, 0x221E"
		def out = file("src/main/resources/assets/club/ui/font/msdf"); out.mkdirs()
		["regular", "medium", "semibold"].each { w ->
			// Use ProcessBuilder (Gradle 9-compatible — no exec{} on DefaultTask)
			def cmd = [
				exe.absolutePath,
				"-font", file("src/main/resources/assets/club/font/inter_${w}.ttf").absolutePath,
				"-charset", charset.absolutePath,
				"-type", "msdf", "-format", "png", "-size", "40", "-pxrange", "6",
				"-imageout", new File(out, "inter_${w}.png").absolutePath,
				"-json", new File(out, "inter_${w}.json").absolutePath
			]
			def pb = new ProcessBuilder(cmd)
			pb.redirectErrorStream(true)
			pb.directory(projectDir)
			def proc = pb.start()
			proc.inputStream.eachLine { line -> logger.lifecycle(line) }
			def exitCode = proc.waitFor()
			if (exitCode != 0) throw new GradleException("msdf-atlas-gen failed for weight '${w}' (exit ${exitCode})")
		}
	}
}