plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	// Pin the runtime/compile toolchain to JDK 21 (the version MC 1.21.1 + LWJGL 3.3.3 support).
	// Without this, the build/runClient use whatever JDK runs Gradle (e.g. 25) — an unsupported
	// combo that LWJGL flags as "Unsupported JNI version" and can cause situational GL instability.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

test {
	useJUnitPlatform()
}

// Offline MSDF atlas generation. Downloads a pinned msdf-atlas-gen and renders
// Inter weights to assets/club/ui/font/msdf/. Run manually: ./gradlew genMsdfAtlas
tasks.register("genMsdfAtlas") {
	group = "club"
	description = "Generate MSDF atlases for Inter (Latin+Cyrillic+Punct+Symbols)."
	doLast {
		def toolDir = file("build/tools")
		def exe = file("build/tools/msdf-atlas-gen-1.4/msdf-atlas-gen/msdf-atlas-gen.exe")
		if (!exe.exists()) {
			toolDir.mkdirs()
			def zip = new File(toolDir, "msdf-atlas-gen-1.4-win64.zip")
			// Use Java standard APIs (Gradle 9-compatible — no URL.withInputStream)
			def url = new java.net.URI("https://github.com/Chlumsky/msdf-atlas-gen/releases/download/v1.4/msdf-atlas-gen-1.4-win64.zip").toURL()
			def conn = url.openConnection()
			conn.setConnectTimeout(30000)
			conn.setReadTimeout(120000)
			zip.withOutputStream { out ->
				conn.inputStream.withCloseable { ins -> ins.transferTo(out) }
			}
			// Unzip using java.util.zip (no Gradle copy{}/zipTree)
			def destDir = new File(toolDir, "msdf-atlas-gen-1.4")
			destDir.mkdirs()
			def destCanon = destDir.canonicalPath
			new java.util.zip.ZipFile(zip).withCloseable { zf ->
				zf.entries().each { entry ->
					def entryFile = new File(destDir, entry.name)
					// Zip-slip guard: ensure extracted path is under destDir
					if (!entryFile.canonicalPath.startsWith(destCanon + File.separator) &&
							entryFile.canonicalPath != destCanon) {
						throw new GradleException("Zip-slip detected: ${entry.name}")
					}
					if (entry.isDirectory()) {
						entryFile.mkdirs()
					} else {
						entryFile.parentFile?.mkdirs()
						new FileOutputStream(entryFile).withCloseable { fos ->
							zf.getInputStream(entry).withCloseable { ins -> ins.transferTo(fos) }
						}
					}
				}
			}
		}
		def charset = file("build/tools/ui_charset.txt")
		charset.text = "[0x20, 0x7E], [0xA0, 0xFF], [0x0400, 0x04FF], 0x2013, 0x2014, 0x2018, 0x2019, 0x201C, 0x201D, 0x2022, 0x2026, 0x2192, 0x221E"
		def out = file("src/main/resources/assets/club/ui/font/msdf"); out.mkdirs()
		["regular", "medium", "semibold"].each { w ->
			// Use ProcessBuilder (Gradle 9-compatible — no exec{} on DefaultTask)
			def cmd = [
				exe.absolutePath,
				"-font", file("src/main/resources/assets/club/font/inter_${w}.ttf").absolutePath,
				"-charset", charset.absolutePath,
				"-type", "msdf", "-format", "png", "-size", "40", "-pxrange", "6",
				"-imageout", new File(out, "inter_${w}.png").absolutePath,
				"-json", new File(out, "inter_${w}.json").absolutePath
			]
			def pb = new ProcessBuilder(cmd)
			pb.redirectErrorStream(true)
			pb.directory(projectDir)
			def proc = pb.start()
			proc.inputStream.eachLine { line -> logger.lifecycle(line) }
			def exitCode = proc.waitFor()
			if (exitCode != 0) throw new GradleException("msdf-atlas-gen failed for weight '${w}' (exit ${exitCode})")
		}
	}
}