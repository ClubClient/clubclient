# Tag -> build -> GitHub Release with the jar attached.
#
# Modrinth is deliberately NOT automated. The owner holds releases back on purpose (v0.1.3 sat built and
# unpublished for weeks), and a workflow that publishes to Modrinth the moment a tag lands takes that
# decision away from him. Upload the jar this workflow builds, by hand, when the page is ready.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release; nothing else

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'          # the toolchain build.gradle pins; MC 1.21.1 + LWJGL 3.3.3
          distribution: 'microsoft'

      - name: cache gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        run: ./gradlew build

      # The tag is the source of truth for the version; if gradle.properties disagrees, the jar we are about
      # to publish is not the one the tag names. Fail loudly rather than ship a mislabelled artifact.
      - name: version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "tag=$TAG  gradle.properties=$MOD"
          [ "$TAG" = "$MOD" ] || { echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$MOD"; exit 1; }

      # Pull this version's section out of CHANGELOG.md — from its "## vX.Y.Z" heading to the next "## ".
      - name: extract changelog
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_BODY.md
          echo "--- release body ---"; cat RELEASE_BODY.md
          [ -s RELEASE_BODY.md ] || { echo "::error::no ${GITHUB_REF_NAME} section in CHANGELOG.md"; exit 1; }

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Club ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: build/libs/club-*.jar
          fail_on_unmatched_files: true

      # A proper Discord announcement, not the bare "github-actions[bot] New release published" one-liner.
      # Posts AS "Club" (icon + brand colour), with this version's changelog and download links. Fires only if
      # the DISCORD_WEBHOOK secret holds the channel's PLAIN webhook URL (the one WITHOUT the /github suffix) —
      # so turn the /github webhook's Releases event OFF once this is set, or both will post.
      - name: announce on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK not set — skipping the announcement"; exit 0; fi
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          # A SHORT, punchy blurb for Discord — the full technical changelog stays on the GitHub release page,
          # linked below. Edit .github/discord-release.md per release; falls back to the changelog if it's gone.
          BLURB=".github/discord-release.md"; [ -s "$BLURB" ] || BLURB="RELEASE_BODY.md"
          jq -n \
            --arg tag "$TAG" \
            --rawfile notes "$BLURB" \
            --arg raw "$RAW" \
            --arg repo "$GITHUB_REPOSITORY" '{
              username: "Club",
              avatar_url: "\($raw)/docs/icon.png",
              content: "@everyone",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                author: { name: "Club · Fabric utility client", icon_url: "\($raw)/docs/icon.png", url: "https://modrinth.com/mod/clubclient" },
                title: "Club \($tag) is out 🎉",
                url: "https://modrinth.com/mod/clubclient",
                description: ($notes | if (length > 4000) then (.[0:3990] + "\n…") else . end),
                color: 8170495,
                image: { url: "\($raw)/docs/gallery/01-hero.png" },
                fields: [
                  { name: "📥 Download", value: "[Modrinth](https://modrinth.com/mod/clubclient)", inline: true },
                  { name: "📄 Full notes", value: "[GitHub release](https://github.com/\($repo)/releases/tag/\($tag))", inline: true }
                ],
                footer: { text: "Fabric 1.21.1 · client-side · MIT" }
              }]
            }' > payload.json
          curl -sS -X POST -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" && echo "announced"
