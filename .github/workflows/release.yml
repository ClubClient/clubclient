# Tag -> build -> GitHub Release with the jar attached.
#
# Modrinth is deliberately NOT automated. The owner holds releases back on purpose (v0.1.3 sat built and
# unpublished for weeks), and a workflow that publishes to Modrinth the moment a tag lands takes that
# decision away from him. Upload the jar this workflow builds, by hand, when the page is ready.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release; nothing else

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'          # the toolchain build.gradle pins; MC 1.21.1 + LWJGL 3.3.3
          distribution: 'microsoft'

      - name: cache gradle
        uses: gradle/actions/setup-gradle@v6

      # Stonecutter makes root `build` depend on every version node, so this one line builds all of them.
      # Verified with `./gradlew build --dry-run`: :1.21.1:build, :1.21.6:build, :1.21.8:build and
      # :1.21.11:build all appear. Nothing here names the versions — the node list lives in settings.gradle
      # and this job counts whatever is there, so adding a node needs no edit to this file.
      - name: build
        run: ./gradlew build

      # One jar per Minecraft version, and the release must carry ALL of them. The glob below points into the
      # version nodes because that is where Stonecutter puts them — the old one read build/libs at the repo
      # root, which the multiversion layout leaves empty, so this workflow would have failed at the publish
      # step (fail_on_unmatched_files) or, worse, shipped nothing.
      #
      # This step exists so that a MISSING version is loud here rather than a quiet gap on the release page:
      # a player on 1.21.8 who finds only a 1.21.1 jar has no way to know whether we forgot or never supported
      # it. Count the jars against the nodes and refuse to publish a partial set.
      - name: every version produced a jar
        run: |
          NODES=$(ls -d versions/*/ | wc -l)
          JARS=$(ls versions/*/build/libs/club-*.jar | wc -l)
          echo "nodes=$NODES jars=$JARS"; ls -la versions/*/build/libs/club-*.jar
          [ "$NODES" = "$JARS" ] || { echo "::error::$NODES version nodes but $JARS jars — refusing to publish a partial release"; exit 1; }

      # Open every jar and look, because the last two artifact bugs were both invisible from the source and
      # obvious from inside the file: a fabric.mod.json that named the wrong Minecraft, and — caught the day
      # this step was written — a jar with NO licence at all. Stonecutter builds each node from versions/<v>/,
      # so build.gradle's relative from("LICENSE") resolved against that directory, found nothing, and `from`
      # on a missing file is silently a no-op. v0.1.2 and v0.1.3 carried LICENSE_club and OFL_club; the first
      # multiversion build carried neither, and compiled, tested and would have released clean.
      #
      # This is not paperwork. The jar ships an MSDF atlas rendered from Onest, which makes it a derivative,
      # and OFL §2 requires the licence to travel with it. Publishing without it is a licence violation, and
      # nothing else in this pipeline can see it.
      - name: every jar carries its licences and knows its Minecraft
        run: |
          FAIL=0
          for J in versions/*/build/libs/club-*.jar; do
            V=$(echo "$J" | cut -d/ -f2)
            HAVE=$(unzip -l "$J" | awk '{print $4}' | grep -cE '^(LICENSE|OFL)_' || true)
            RANGE=$(unzip -p "$J" fabric.mod.json | grep -o '"minecraft": *"[^"]*"' || true)
            echo "$V: licence files=$HAVE  $RANGE"
            [ "$HAVE" -ge 2 ] || { echo "::error::$J carries $HAVE licence files, expected LICENSE_* and OFL_*"; FAIL=1; }
            echo "$RANGE" | grep -q "$V" || { echo "::error::$J does not declare Minecraft $V — it would be refused at the player's launcher, naming OUR mod"; FAIL=1; }
          done
          exit $FAIL

      # The tag is the source of truth for the version; if gradle.properties disagrees, the jar we are about
      # to publish is not the one the tag names. Fail loudly rather than ship a mislabelled artifact.
      - name: version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "tag=$TAG  gradle.properties=$MOD"
          [ "$TAG" = "$MOD" ] || { echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$MOD"; exit 1; }

      # Pull this version's section out of docs/CHANGELOG.md — from its "## vX.Y.Z" heading to the next "## ".
      - name: extract changelog
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' docs/CHANGELOG.md > RELEASE_BODY.md
          echo "--- release body ---"; cat RELEASE_BODY.md
          [ -s RELEASE_BODY.md ] || { echo "::error::no ${GITHUB_REF_NAME} section in docs/CHANGELOG.md"; exit 1; }

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Club ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: versions/*/build/libs/club-*.jar
          fail_on_unmatched_files: true

      # A proper Discord announcement, not the bare "github-actions[bot] New release published" one-liner.
      # Posts AS "Club" (icon + brand colour), with this version's changelog and download links. Fires only if
      # the DISCORD_WEBHOOK secret holds the channel's PLAIN webhook URL (the one WITHOUT the /github suffix) —
      # so turn the /github webhook's Releases event OFF once this is set, or both will post.
      - name: announce on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK not set — skipping the announcement"; exit 0; fi
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          # A SHORT, punchy blurb for Discord — the full technical changelog stays on the GitHub release page,
          # linked below. Edit .github/discord-release.md per release; falls back to the changelog if it's gone.
          BLURB=".github/discord-release.md"; [ -s "$BLURB" ] || BLURB="RELEASE_BODY.md"
          jq -n \
            --arg tag "$TAG" \
            --rawfile notes "$BLURB" \
            --arg raw "$RAW" \
            --arg repo "$GITHUB_REPOSITORY" '{
              username: "Club",
              avatar_url: "\($raw)/docs/icon.png",
              content: "@everyone",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                author: { name: "Club · Fabric utility client", icon_url: "\($raw)/docs/icon.png", url: "https://modrinth.com/mod/clubclient" },
                title: "Club \($tag) is out 🎉",
                url: "https://modrinth.com/mod/clubclient",
                description: ($notes | if (length > 4000) then (.[0:3990] + "\n…") else . end),
                color: 8170495,
                image: { url: "\($raw)/docs/gallery/01-hero.png" },
                fields: [
                  { name: "📥 Download", value: "[Modrinth](https://modrinth.com/mod/clubclient)", inline: true },
                  { name: "📄 Full notes", value: "[GitHub release](https://github.com/\($repo)/releases/tag/\($tag))", inline: true }
                ],
                footer: { text: "Fabric · client-side · MIT" }
              }]
            }' > payload.json
          curl -sS -X POST -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" && echo "announced"
