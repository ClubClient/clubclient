# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: read

# A force-push should not leave two builds racing for the same cache.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # Stage 33: pinned to the project's actual toolchain (Java 21, see build.gradle) — the
          # template's JDK 25 wasn't what local builds run on.
          java-version: '21'
          distribution: 'microsoft'
      # Without this every run re-downloads Minecraft, the mappings and the whole Loom cache.
      - name: cache gradle
        uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
